<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limedrop.ai - Desktop OS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Desktop Container -->
    <div id="desktop" class="desktop">
        <!-- Desktop Background -->
        <div class="desktop-background"></div>
        
        <!-- Desktop Icons -->
        <div class="desktop-icons">
            <div class="desktop-icon" data-app="app-builder">
                <div class="icon-image"><i class="fas fa-hammer"></i></div>
                <div class="icon-label">App Builder</div>
            </div>
            <div class="desktop-icon" data-app="app-manager">
                <div class="icon-image"><i class="fas fa-th-large"></i></div>
                <div class="icon-label">App Manager</div>
            </div>
            <div class="desktop-icon" data-app="file-manager">
                <div class="icon-image"><i class="fas fa-folder"></i></div>
                <div class="icon-label">Files</div>
            </div>
            <div class="desktop-icon" data-app="settings">
                <div class="icon-image"><i class="fas fa-cog"></i></div>
                <div class="icon-label">Settings</div>
            </div>
        </div>
        
        <!-- Windows Container -->
        <div id="windows-container" class="windows-container"></div>
        
        <!-- Dock/Taskbar -->
        <div class="dock">
            <div class="dock-system" id="dock-system">
                <div class="dock-item" data-app="app-builder">
                    <div class="dock-icon"><i class="fas fa-hammer"></i></div>
                    <div class="dock-tooltip">App Builder</div>
                </div>
                <div class="dock-item" data-app="app-manager">
                    <div class="dock-icon"><i class="fas fa-th-large"></i></div>
                    <div class="dock-tooltip">App Manager</div>
                </div>
                <div class="dock-item" data-app="file-manager">
                    <div class="dock-icon"><i class="fas fa-folder"></i></div>
                    <div class="dock-tooltip">Files</div>
                </div>
                <div class="dock-item" data-app="settings">
                    <div class="dock-icon"><i class="fas fa-cog"></i></div>
                    <div class="dock-tooltip">Settings</div>
                </div>
            </div>
            <div class="dock-separator"></div>
            <div class="dock-favorites" id="dock-favorites"></div>
            <div class="dock-separator" id="dock-separator-2" style="display: none;"></div>
            <div class="dock-running" id="dock-running"></div>
        </div>
    </div>

    <!-- Modal/Popup System -->
    <div id="modal-overlay" class="modal-overlay"></div>
    
    <!-- Notification Container -->
    <div id="notification-container" class="notification-container"></div>

    <!-- Window Template -->
    <template id="window-template">
        <div class="window">
            <div class="window-header">
                <div class="window-title"></div>
                <div class="window-controls">
                    <button class="window-control minimize">−</button>
                    <button class="window-control maximize">□</button>
                    <button class="window-control close">×</button>
                </div>
            </div>
            <div class="window-content"></div>
            <div class="window-resize-handle"></div>
        </div>
    </template>

    <!-- App Builder Template -->
    <template id="app-builder-template">
        <div class="app-builder">
            <div class="app-builder-header">
                <h2>Create New App</h2>
                <div class="app-builder-controls">
                    <div id="app-icon-picker" class="app-icon-picker"></div>
                    <input type="text" class="app-name-input" placeholder="App Name">
                    <button class="btn-primary save-app">Save App</button>
                </div>
            </div>
            
            <div class="app-builder-body">
                <div class="components-panel">
                    <h3>Components</h3>
                    <div class="component-category">
                        <h4>Input Components</h4>
                        <div class="component-item" data-type="text-input" draggable="true">
                            <span class="component-icon"><i class="fas fa-keyboard"></i></span>
                            <span>Text Input</span>
                        </div>
                        <div class="component-item" data-type="file-upload" draggable="true">
                            <span class="component-icon"><i class="fas fa-upload"></i></span>
                            <span>File Upload</span>
                        </div>
                        <div class="component-item" data-type="canvas" draggable="true">
                            <span class="component-icon"><i class="fas fa-paint-brush"></i></span>
                            <span>Drawing Canvas</span>
                        </div>
                        <div class="component-item" data-type="rich-text" draggable="true">
                            <span class="component-icon"><i class="fas fa-file-alt"></i></span>
                            <span>Rich Text Editor</span>
                        </div>
                    </div>
                    
                    <div class="component-category">
                        <h4>Processing</h4>
                        <div class="component-item" data-type="ai-prompt" draggable="true">
                            <span class="component-icon"><i class="fas fa-robot"></i></span>
                            <span>AI Prompt</span>
                        </div>
                        <div class="component-item" data-type="data-transform" draggable="true">
                            <span class="component-icon"><i class="fas fa-exchange-alt"></i></span>
                            <span>Data Transform</span>
                        </div>
                    </div>
                    
                    <div class="component-category">
                        <h4>Output Components</h4>
                        <div class="component-item" data-type="display" draggable="true">
                            <span class="component-icon"><i class="fas fa-tv"></i></span>
                            <span>Display Output</span>
                        </div>
                        <div class="component-item" data-type="chart" draggable="true">
                            <span class="component-icon"><i class="fas fa-chart-bar"></i></span>
                            <span>Chart</span>
                        </div>
                        <div class="component-item" data-type="export" draggable="true">
                            <span class="component-icon"><i class="fas fa-download"></i></span>
                            <span>Export Data</span>
                        </div>
                    </div>
                </div>
                
                <div class="workflow-panel">
                    <h3>App Workflow</h3>
                    <div class="workflow-container" id="workflow-container">
                        <div class="workflow-placeholder">Drag components here to build your app</div>
                    </div>
                </div>
                
                <div class="properties-panel">
                    <h3>Properties</h3>
                    <div class="properties-content" id="properties-content">
                        <p class="properties-placeholder">Select a component to configure</p>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- File Manager Template -->
    <template id="file-manager-template">
        <div class="file-manager">
            <div class="file-manager-header">
                <h2>File Manager</h2>
                <div class="file-manager-controls">
                    <button class="btn-secondary new-file">New File</button>
                    <button class="btn-secondary new-type">New Type</button>
                    <button class="btn-secondary import-file">Import</button>
                    <button class="btn-primary export-file">Export</button>
                </div>
            </div>
            
            <div class="file-manager-body">
                <div class="file-types-panel">
                    <h3>File Types</h3>
                    <div class="file-types-list" id="file-types-list">
                        <div class="file-type-item active" data-type="default">
                            <span class="file-type-icon"><i class="fas fa-file"></i></span>
                            <span>Default</span>
                        </div>
                    </div>
                </div>
                
                <div class="files-panel">
                    <h3>Files</h3>
                    <div class="files-grid" id="files-grid">
                        <!-- Files will be dynamically added here -->
                    </div>
                </div>
                
                <div class="file-preview-panel">
                    <h3>Preview</h3>
                    <div class="file-preview-content" id="file-preview-content">
                        <p class="preview-placeholder">Select a file to preview</p>
                    </div>
                </div>
            </div>
        </div>
    </template>

                                <div class="module-option" data-value="gradient50">
                                    <div class="gradient-preview" data-gradient="linear-gradient(135deg, #fff1cc 0%, #ffb700 25%, #6d28d9 50%, #2e1065 75%, #0f172a 100%)"></div>
                                    <span class="module-option-name">Mango Ube Charcoal Swirl</span>
                                </div>
                                <div class="module-option" data-value="gradient51">
                                    <div class="gradient-preview" data-gradient="linear-gradient(135deg, #fff8f0 0%, #84cc16 25%, #ef4444 50%, #ffe4e6 75%, #fff8f0 100%)"></div>
                                    <span class="module-option-name">Kiwi Strawberry Latte</span>
                                </div>
                                <div class="module-option" data-value="gradient52">
                                    <div class="gradient-preview" data-gradient="linear-gradient(135deg, #ffffff 0%, #ff0db0 25%, #84cc16 50%, #111827 75%, #f5f5f5 100%)"></div>
                                    <span class="module-option-name">Dragonfruit Lime Cream</span>
                                </div>
                                <div class="module-option" data-value="gradient53">
                                    <div class="gradient-preview" data-gradient="linear-gradient(135deg, #ff7a00 0%, #ffd29c 25%, #b3a08a 50%, #2f2f2f 75%, #fffaf2 100%)"></div>
                                    <span class="module-option-name">Orange Sesame Cream</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="settings-section">
                    <h3>Colors</h3>
                    <div class="setting-item">
                        <label>Font Color</label>
                        <div class="color-picker-wrapper">
                            <input type="color" id="font-color" value="#ffffff">
                            <button class="color-reset" data-target="font-color" data-default="#ffffff">Reset</button>
                        </div>
                    </div>
                    
                    <!-- Primary Button Settings -->
                    <div class="setting-item">
                        <label>Primary Button Style</label>
                        <div class="module-dropdown" id="button-style-dropdown">
                            <button class="module-dropdown-toggle" type="button">
                                <span class="dropdown-selected-text">Solid Color</span>
                                <i class="fas fa-chevron-down"></i>
                            </button>
                            <div class="module-dropdown-menu hide">
                                <div class="module-option" data-value="solid">
                                    <span class="module-option-name">Solid Color</span>
                                </div>
                                <div class="module-option" data-value="gradient">
                                    <span class="module-option-name">Gradient</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="setting-item" id="primary-solid-controls">
                        <label>Primary Button Color</label>
                        <div class="color-picker-wrapper">
                            <input type="color" id="primary-button-color" value="#667eea">
                            <button class="color-reset" data-target="primary-button-color" data-default="#667eea">Reset</button>
                        </div>
                    </div>
                    <div class="setting-item" id="primary-gradient-controls" style="display: none;">
                        <label>Primary Button Gradient</label>
                        <div class="gradient-picker-wrapper">
                            <div class="color-picker-wrapper">
                                <label class="gradient-label">From:</label>
                                <input type="color" id="primary-gradient-start" value="#667eea">
                            </div>
                            <div class="color-picker-wrapper">
                                <label class="gradient-label">To:</label>
                                <input type="color" id="primary-gradient-end" value="#764ba2">
                            </div>
                            <button class="color-reset" data-type="gradient-reset" data-start="#667eea" data-end="#764ba2">Reset</button>
                        </div>
                    </div>
                    <div class="setting-item">
                        <label>Primary Button Text</label>
                        <div class="color-picker-wrapper">
                            <input type="color" id="primary-button-text" value="#ffffff">
                            <button class="color-reset" data-target="primary-button-text" data-default="#ffffff">Reset</button>
                        </div>
                    </div>
                    
                    <!-- Secondary Button Settings -->
                    <div class="setting-item">
                        <label>Secondary Button Background</label>
                        <div class="color-picker-wrapper">
                            <input type="color" id="secondary-button-bg" value="#ffffff">
                            <input type="range" id="secondary-button-opacity" min="5" max="100" value="10" title="Background Opacity">
                            <button class="color-reset" data-target="secondary-button-bg" data-default="#ffffff" data-opacity="10">Reset</button>
                        </div>
                    </div>
                    <div class="setting-item">
                        <label>Secondary Button Text</label>
                        <div class="color-picker-wrapper">
                            <input type="color" id="secondary-button-text" value="#ffffff">
                            <button class="color-reset" data-target="secondary-button-text" data-default="#ffffff">Reset</button>
                        </div>
                    </div>
                    <div class="setting-item">
                        <label>Secondary Button Border</label>
                        <div class="color-picker-wrapper">
                            <input type="color" id="secondary-button-border" value="#ffffff">
                            <input type="range" id="secondary-border-opacity" min="10" max="100" value="20" title="Border Opacity">
                            <button class="color-reset" data-target="secondary-button-border" data-default="#ffffff" data-border-opacity="20">Reset</button>
                        </div>
                    </div>
                    
                    <div class="setting-item">
                        <label>Window Tint</label>
                        <div class="color-picker-wrapper">
                            <input type="color" id="window-tint-color" value="#ffffff">
                            <button class="color-reset" data-target="window-tint-color" data-default="#ffffff">Reset</button>
                        </div>
                    </div>
                </div>
                
                <div class="settings-section">
                    <h3>System</h3>
                    <div class="setting-item">
                        <label>Auto-save</label>
                        <input type="checkbox" id="auto-save" checked>
                    </div>
                    <div class="setting-item">
                        <label>Show Desktop Icons</label>
                        <input type="checkbox" id="show-icons" checked>
                    </div>
                    <div class="setting-item">
                        <button class="btn-danger clear-storage">Clear All Data</button>
                    </div>
                </div>
                
                <div class="settings-section">
                    <h3>About</h3>
                    <p>Limedrop.ai v1.0</p>
                    <p>A modular desktop OS simulation</p>
                </div>
            </div>
        </div>
    </template>

    <!-- Component Configuration Templates -->
    <template id="text-input-config">
        <div class="config-form">
            <div class="form-group">
                <label>Label</label>
                <input type="text" class="config-label" placeholder="Enter label">
            </div>
            <div class="form-group">
                <label>Placeholder</label>
                <input type="text" class="config-placeholder" placeholder="Enter placeholder text">
            </div>
            <div class="form-group">
                <label>Required</label>
                <input type="checkbox" class="config-required">
            </div>
        </div>
    </template>

    <template id="ai-prompt-config">
        <div class="config-form">
            <div class="form-group">
                <label>Prompt Template</label>
                <textarea class="config-prompt" rows="5" placeholder="Enter your prompt. Use {{variable}} for inputs"></textarea>
            </div>
            <div class="form-group">
                <label>Model</label>
                <select class="config-model">
                    <option value="gpt-3.5">GPT-3.5</option>
                    <option value="gpt-4">GPT-4</option>
                </select>
            </div>
        </div>
    </template>

    <template id="chart-config">
        <div class="config-form">
            <div class="form-group">
                <label>Chart Type</label>
                <select class="config-chart-type">
                    <option value="bar">Bar Chart</option>
                    <option value="line">Line Chart</option>
                    <option value="pie">Pie Chart</option>
                </select>
            </div>
            <div class="form-group">
                <label>Title</label>
                <input type="text" class="config-title" placeholder="Chart title">
            </div>
        </div>
    </template>

    <!-- Modal Templates -->
    <template id="modal-template">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title"></div>
                <button class="modal-close">×</button>
            </div>
            <div class="modal-body"></div>
            <div class="modal-footer"></div>
        </div>
    </template>

    <!-- Alert Modal Template -->
    <template id="alert-modal-template">
        <div class="modal-content">
            <div class="modal-icon"></div>
            <div class="modal-message"></div>
        </div>
        <div class="modal-actions">
            <button class="btn-primary modal-ok">OK</button>
        </div>
    </template>

    <!-- Confirm Modal Template -->
    <template id="confirm-modal-template">
        <div class="modal-content">
            <div class="modal-icon"><i class="fas fa-exclamation-triangle"></i></div>
            <div class="modal-message"></div>
        </div>
        <div class="modal-actions">
            <button class="btn-secondary modal-cancel">Cancel</button>
            <button class="btn-primary modal-confirm">Confirm</button>
        </div>
    </template>

    <!-- Prompt Modal Template -->
    <template id="prompt-modal-template">
        <div class="modal-content">
            <div class="modal-message"></div>
            <input type="text" class="modal-input" placeholder="">
        </div>
        <div class="modal-actions">
            <button class="btn-secondary modal-cancel">Cancel</button>
            <button class="btn-primary modal-ok">OK</button>
        </div>
    </template>

    <!-- Form Modal Template -->
    <template id="form-modal-template">
        <div class="modal-content">
            <form class="modal-form"></form>
        </div>
        <div class="modal-actions">
            <button class="btn-secondary modal-cancel">Cancel</button>
            <button class="btn-primary modal-submit">Submit</button>
        </div>
    </template>

    <!-- Icon Picker Template -->
    <template id="icon-picker-template">
        <div class="icon-picker">
            <div class="icon-picker-header">
                <div class="icon-picker-selected">
                    <div class="selected-icon-preview">
                        <i class="fas fa-cube"></i>
                    </div>
                    <span class="selected-icon-name">Selected App Icon</span>
                </div>
                <button class="icon-picker-toggle">
                    <i class="fas fa-chevron-down"></i>
                </button>
            </div>
            <div class="icon-picker-dropdown">
                <div class="icon-picker-search">
                    <input type="text" class="icon-search-input" placeholder="Search icons (e.g., chart, user, star)">
                </div>
                <div class="icon-picker-categories">
                    <button class="icon-category-btn active" data-category="all">All</button>
                    <button class="icon-category-btn" data-category="files">Files</button>
                    <button class="icon-category-btn" data-category="edit">Edit</button>
                    <button class="icon-category-btn" data-category="user">User</button>
                    <button class="icon-category-btn" data-category="chat">Chat</button>
                    <button class="icon-category-btn" data-category="code">Code</button>
                    <button class="icon-category-btn" data-category="data">Data</button>
                    <button class="icon-category-btn" data-category="media">Media</button>
                    <button class="icon-category-btn" data-category="chart">Chart</button>
                    <button class="icon-category-btn" data-category="tool">Tool</button>
                    <button class="icon-category-btn" data-category="nav">Nav</button>
                    <button class="icon-category-btn" data-category="shape">Shape</button>
                    <button class="icon-category-btn" data-category="life">Life</button>
                    <button class="icon-category-btn" data-category="world">World</button>
                    <button class="icon-category-btn" data-category="fun">Fun</button>
                    <button class="icon-category-btn" data-category="lock">Lock</button>
                    <button class="icon-category-btn" data-category="brand">Brand</button>
                </div>
                <div class="icon-picker-grid">
                    <!-- Icons will be dynamically populated here -->
                </div>
            </div>
        </div>
    </template>

    <!-- Notification Template -->
    <template id="notification-template">
        <div class="notification">
            <div class="notification-icon"></div>
            <div class="notification-content">
                <div class="notification-title"></div>
                <div class="notification-message"></div>
            </div>
            <button class="notification-close">×</button>
        </div>
    </template>

    <!-- Context Menu Template -->
    <template id="context-menu-template">
        <div class="context-menu">
            <div class="context-menu-item">Open</div>
            <div class="context-menu-item">Edit</div>
            <div class="context-menu-separator"></div>
            <div class="context-menu-item">Delete</div>
        </div>
    </template>

    <script src="js/core/event-bus.js"></script>
    <script src="js/ui/icon-picker.js"></script>
    <script src="js/ui/modal-manager.js"></script>
    <script src="js/ui/notification-manager.js"></script>
    <script src="js/windows/window-manager.js"></script>
    <script src="js/fs/file-system.js"></script>
    <script src="js/apps/app-runtime.js"></script>
    <script src="js/apps/app-builder.js"></script>
    <script src="js/apps/file-manager.js"></script>
    <script src="js/apps/settings.js"></script>
    <script src="js/apps/app-registry.js"></script>
    <script src="js/apps/app-manager.js"></script>
    <script src="js/boot.js"></script>
</body>
</html>
