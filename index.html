<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limedrop.ai - Desktop OS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Desktop Container -->
    <div id="desktop" class="desktop">
        <!-- Desktop Background -->
        <div class="desktop-background"></div>
        
        <!-- Desktop Icons -->
        <div class="desktop-icons">
            <div class="desktop-icon" data-app="app-builder">
                <div class="icon-image"><i class="fas fa-hammer"></i></div>
                <div class="icon-label">App Builder</div>
            </div>
            <div class="desktop-icon" data-app="app-manager">
                <div class="icon-image"><i class="fas fa-th-large"></i></div>
                <div class="icon-label">App Manager</div>
            </div>
            <div class="desktop-icon" data-app="file-manager">
                <div class="icon-image"><i class="fas fa-folder"></i></div>
                <div class="icon-label">Files</div>
            </div>
            <div class="desktop-icon" data-app="settings">
                <div class="icon-image"><i class="fas fa-cog"></i></div>
                <div class="icon-label">Settings</div>
            </div>
        </div>
        
        <!-- Windows Container -->
        <div id="windows-container" class="windows-container"></div>
        
        <!-- Dock/Taskbar -->
        <div class="dock">
            <div class="dock-system" id="dock-system">
                <div class="dock-item" data-app="app-builder">
                    <div class="dock-icon"><i class="fas fa-hammer"></i></div>
                    <div class="dock-tooltip">App Builder</div>
                </div>
                <div class="dock-item" data-app="app-manager">
                    <div class="dock-icon"><i class="fas fa-th-large"></i></div>
                    <div class="dock-tooltip">App Manager</div>
                </div>
                <div class="dock-item" data-app="file-manager">
                    <div class="dock-icon"><i class="fas fa-folder"></i></div>
                    <div class="dock-tooltip">Files</div>
                </div>
                <div class="dock-item" data-app="settings">
                    <div class="dock-icon"><i class="fas fa-cog"></i></div>
                    <div class="dock-tooltip">Settings</div>
                </div>
            </div>
            <div class="dock-separator"></div>
            <div class="dock-favorites" id="dock-favorites"></div>
            <div class="dock-separator" id="dock-separator-2" style="display: none;"></div>
            <div class="dock-running" id="dock-running"></div>
        </div>
    </div>

    <!-- Modal/Popup System -->
    <div id="modal-overlay" class="modal-overlay"></div>
    
    <!-- Notification Container -->
    <div id="notification-container" class="notification-container"></div>

    <!-- Window Template -->
    <template id="window-template">
        <div class="window">
            <div class="window-header">
                <div class="window-title"></div>
                <div class="window-controls">
                    <button class="window-control minimize">−</button>
                    <button class="window-control maximize">□</button>
                    <button class="window-control close">×</button>
                </div>
            </div>
            <div class="window-content"></div>
            <div class="window-resize-handle"></div>
        </div>
    </template>

    <!-- App Builder Template -->
    <template id="app-builder-template">
        <div class="app-builder">
            <div class="app-builder-header">
                <h2>Create New App</h2>
                <div class="app-builder-controls">
                    <div id="app-icon-picker" class="app-icon-picker"></div>
                    <input type="text" class="app-name-input" placeholder="App Name">
                    <button class="btn-primary save-app">Save App</button>
                </div>
            </div>
            
            <div class="app-builder-body">
                <div class="components-panel">
                    <h3>Components</h3>
                    <div class="component-category">
                        <h4>Input Components</h4>
                        <div class="component-item" data-type="text-input" draggable="true">
                            <span class="component-icon"><i class="fas fa-keyboard"></i></span>
                            <span>Text Input</span>
                        </div>
                        <div class="component-item" data-type="file-upload" draggable="true">
                            <span class="component-icon"><i class="fas fa-upload"></i></span>
                            <span>File Upload</span>
                        </div>
                        <div class="component-item" data-type="canvas" draggable="true">
                            <span class="component-icon"><i class="fas fa-paint-brush"></i></span>
                            <span>Drawing Canvas</span>
                        </div>
                        <div class="component-item" data-type="rich-text" draggable="true">
                            <span class="component-icon"><i class="fas fa-file-alt"></i></span>
                            <span>Rich Text Editor</span>
                        </div>
                    </div>
                    
                    <div class="component-category">
                        <h4>Processing</h4>
                        <div class="component-item" data-type="ai-prompt" draggable="true">
                            <span class="component-icon"><i class="fas fa-robot"></i></span>
                            <span>AI Prompt</span>
                        </div>
                        <div class="component-item" data-type="data-transform" draggable="true">
                            <span class="component-icon"><i class="fas fa-exchange-alt"></i></span>
                            <span>Data Transform</span>
                        </div>
                    </div>
                    
                    <div class="component-category">
                        <h4>Output Components</h4>
                        <div class="component-item" data-type="display" draggable="true">
                            <span class="component-icon"><i class="fas fa-tv"></i></span>
                            <span>Display Output</span>
                        </div>
                        <div class="component-item" data-type="chart" draggable="true">
                            <span class="component-icon"><i class="fas fa-chart-bar"></i></span>
                            <span>Chart</span>
                        </div>
                        <div class="component-item" data-type="export" draggable="true">
                            <span class="component-icon"><i class="fas fa-download"></i></span>
                            <span>Export Data</span>
                        </div>
                    </div>
                </div>
                
                <div class="workflow-panel">
                    <h3>App Workflow</h3>
                    <div class="workflow-container" id="workflow-container">
                        <div class="workflow-placeholder">Drag components here to build your app</div>
                    </div>
                </div>
                
                <div class="properties-panel">
                    <h3>Properties</h3>
                    <div class="properties-content" id="properties-content">
                        <p class="properties-placeholder">Select a component to configure</p>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- File Manager Template -->
    <template id="file-manager-template">
        <div class="file-manager">
            <div class="file-manager-header">
                <h2>File Manager</h2>
                <div class="file-manager-controls">
                    <button class="btn-secondary new-file">New File</button>
                    <button class="btn-secondary new-type">New Type</button>
                    <button class="btn-secondary import-file">Import</button>
                    <button class="btn-primary export-file">Export</button>
                </div>
            </div>
            
            <div class="file-manager-body">
                <div class="file-types-panel">
                    <h3>File Types</h3>
                    <div class="file-types-list" id="file-types-list">
                        <div class="file-type-item active" data-type="default">
                            <span class="file-type-icon"><i class="fas fa-file"></i></span>
                            <span>Default</span>
                        </div>
                    </div>
                </div>
                
                <div class="files-panel">
                    <h3>Files</h3>
                    <div class="files-grid" id="files-grid">
                        <!-- Files will be dynamically added here -->
                    </div>
                </div>
                
                <div class="file-preview-panel">
                    <h3>Preview</h3>
                    <div class="file-preview-content" id="file-preview-content">
                        <p class="preview-placeholder">Select a file to preview</p>
                    </div>
                </div>
            </div>
        </div>
    </template>

                    <script>
                    // Enhanced animation controls JavaScript - Add this to your settings initialization
                    document.addEventListener('DOMContentLoaded', function() {
                        // Animation intensity control
                        const intensitySlider = document.getElementById('animation-intensity');
                        const intensityValue = document.querySelector('.intensity-value');
                        const previewBtn = document.getElementById('preview-current-animation');
                        
                        if (intensitySlider && intensityValue) {
                            intensitySlider.addEventListener('input', function() {
                                const value = this.value;
                                intensityValue.textContent = value + '%';
                                
                                // Apply intensity scaling to animations
                                const desktop = document.querySelector('.desktop-background');
                                if (desktop) {
                                    const intensity = value / 100;
                                    desktop.style.setProperty('--animation-intensity', intensity);
                                    desktop.style.animationDuration = `${Math.max(2, 15 / intensity)}s`;
                                }
                            });
                        }
                        
                        // Preview button functionality
                        if (previewBtn) {
                            previewBtn.addEventListener('click', function() {
                                const dropdown = document.getElementById('animation-style-dropdown');
                                const selectedOption = dropdown.querySelector('.module-option.selected');
                                const currentStyle = selectedOption ? selectedOption.dataset.value : 'gradient-flow';
                                
                                // Add previewing state
                                this.classList.add('previewing');
                                this.innerHTML = '<i class="fas fa-spinner"></i> Previewing...';
                                
                                // Enable animation temporarily
                                const desktop = document.querySelector('.desktop-background');
                                const wasAnimated = desktop.classList.contains('animated');
                                
                                if (!wasAnimated) {
                                    desktop.classList.add('animated');
                                }
                                
                                // Apply the style
                                desktop.className = desktop.className.replace(/\b(gradient-flow|floating-orbs|breathing|pulse-waves|color-shift|shimmer|particle-flow)\b/g, '');
                                desktop.classList.add(currentStyle);
                                
                                // Show notification
                                if (window.notificationManager) {
                                    window.notificationManager.show({
                                        title: 'Animation Preview',
                                        message: `Previewing ${currentStyle.replace('-', ' ')} animation...`,
                                        type: 'info',
                                        duration: 3000
                                    });
                                }
                                
                                // Reset after 3 seconds
                                setTimeout(() => {
                                    this.classList.remove('previewing');
                                    this.innerHTML = '<i class="fas fa-eye"></i> Preview';
                                    
                                    // Restore original state if animations were disabled
                                    const animationCheckbox = document.getElementById('background-animation');
                                    if (!animationCheckbox.checked && !wasAnimated) {
                                        desktop.classList.remove('animated', currentStyle);
                                    }
                                }, 3000);
                            });
                        }
                    });
